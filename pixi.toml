[workspace]
authors = ["Convolutio <79534557+Convolutio@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "engischo_family_tree"
# TODO: inotify tools is only available on linux
platforms = ["linux-64"]
preview = ["pixi-build"]
version = "0.1.0"

[dependencies]
eirb_family_tree = { path = "." }

[tasks]
eirbtree = "eirbtree"

[package]
name = "eirb_family_tree"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-python"
version = "0.*"

[package.build.config]
ignore-pypi-mapping = false  # Enable automatic PyPI-to-conda mapping

[package.host-dependencies]
hatchling = "==1.26.3"

[package.run-dependencies]
# system deps
python = ">=3.13"
graphviz = ">=13.1.2,<14.0" 
imagemagick = ">=7.1.2_5,<8.0"
make = "*"
inotify-tools = "*"

[feature.dev.dependencies]
pytest = "*"
mypy = "*"

[environments]
dev = ["dev"]
