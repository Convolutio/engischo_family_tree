[build-system]  
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eirb-family-tree"
version = "1.0.0"
description = "ENSEIRB Family Tree generator"
requires-python = ">=3.13"
dependencies = [
  "graphviz>=0.21,<1.0",
  "pydantic>=2.12.0,<3.0",
  "treelib>=1.7.1,<2.0",
  "click>=8.3.0,<9.0",
]

[project.scripts]
eirbtree = "eirb_family_tree.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2,<9.0.0",
  "mypy>=1.18.2,<2.0.0",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
